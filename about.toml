# cargo-about configuration for generating THIRD_PARTY_NOTICES.md
#
# Only the Windows release artifact is shipped, so licenses are collected for
# that target alone. Build- and dev-only dependencies are not redistributed and
# are excluded. Every license listed below is permissive (no copyleft: no
# GPL/LGPL/MPL-2.0/EUPL/CDDL). cargo-about fails if a dependency introduces a
# license that is not in `accepted`.

targets = ["x86_64-pc-windows-msvc"]

ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# Exclude the AudioFrame crate itself (publish = false) from the third-party list.
private = { ignore = true }

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
]

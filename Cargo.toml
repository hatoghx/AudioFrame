[package]
name = "audioframe"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "MMD-synced multi-track audio arranger for After Effects export"
license = "MIT"
publish = false

[[bin]]
name = "AudioFrame"
path = "src/main.rs"

[dependencies]
# GUI: immediate-mode, glow (OpenGL) backend only. No wgpu (keeps the license/dep surface small).
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"

# 音声
cpal = "0.15"
hound = "3"
arc-swap = "1"

# MMD 連携（Win32）。cpal が既に引いている windows 0.54 に合わせて版を固定。
[target.'cfg(windows)'.dependencies.windows]
version = "0.54"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_System_LibraryLoader",
    # 動画/圧縮音声のデコード（OS 標準・ライセンス問題なし）
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# cargo-deny: 配布物を MIT License で出せるよう、依存(推移的・build-deps 含む)の
# ライセンスを許可リストで固定する。コピーレフト(GPL/LGPL/MPL/EUPL 等)は一切不可。

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "0BSD",
  "Unlicense",     # memchr / walkdir / aho-corasick 等（公有相当）
  "BSL-1.0",       # clipboard-win / error-code（Boost、コピーレフトなし）
  "OFL-1.1",       # epaint_default_fonts が同梱する Ubuntu/Hack フォント
  "LicenseRef-UFL-1.0", # 同上（Ubuntu Font License）
]

# フォント同梱物（OFL-1.1 / UFL-1.0）はソフトウェア再配布を許可する permissive ライセンス。
# 本体は自前で Windows の CJK フォントを読むため、これらは fallback 用。
[[licenses.clarify]]
name = "epaint_default_fonts"
expression = "(MIT OR Apache-2.0) AND OFL-1.1 AND LicenseRef-UFL-1.0"
license-files = []

[bans]
multiple-versions = "warn"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
